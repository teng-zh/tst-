<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            width: 100%;
            max-width: 1200px;
            height: auto;
            outline: none;
        }
    </style>
</head>
<body>
    <video autoplay controls>
        <source src="{{ video_url }}" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>
</body>
</html>
